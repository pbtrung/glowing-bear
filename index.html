<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Glowing Bear" />
        <meta name="theme-color" content="#232323" />
        <meta http-equiv="x-dns-prefetch-control" content="off" />
        <title>Glowing Bear</title>
        <link rel="manifest" href="webapp.manifest.json" />
        <link rel="icon" sizes="128x128" href="assets/img/glowing_bear_128x128.png" />
        <link
            rel="apple-touch-icon"
            sizes="128x128"
            href="assets/img/glowing_bear_128x128.png"
        />
        <link rel="icon" type="image/png" href="assets/img/favicon.png" />
        <script>
            // Fetch the theme stylesheet right away (theme.ts applies it)
            try {
                const theme = JSON.parse(localStorage.getItem('theme') || '"dark"');
                if (/^[\w-]+$/.test(theme)) {
                    const link = document.createElement('link');
                    link.rel = 'preload';
                    link.as = 'style';
                    link.href = 'css/themes/' + theme + '.css';
                    document.head.appendChild(link);
                }
            } catch {
                // no storage
            }
        </script>
    </head>
    <body>
        <noscript
            >Glowing Bear requires JavaScript support to function. Please check your
            script blocker or browser settings.</noscript
        >
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
